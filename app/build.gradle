plugins { id 'com.android.application' }
android {
    namespace 'vn.quehomnay'
    compileSdk 34
    defaultConfig {
        applicationId 'vn.quehomnay'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    signingConfigs {
        app { storeFile file('quehomnay.jks'); storePassword 'quehomnay'; keyAlias 'quehomnay'; keyPassword 'quehomnay' }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.app } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
