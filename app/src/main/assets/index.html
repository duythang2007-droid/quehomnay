<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd3e1">
<title>Quẻ hôm nay</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Noto+Serif+Display:wght@700;800&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff0f4;--bg2:#ffdce7;--card:#ffffffcc;--rose:#e46f96;--rose2:#c94f7a;--deep:#7a2e4a;--ink:#4a2333;--soft:#9a6278;--edge:#f6bfd0;--gold:#d9a441}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100vh;background:var(--bg)}
body{color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif;background:radial-gradient(120% 60% at 50% -10%,#ffd3e1 0,var(--bg) 60%,#ffe9f0 100%);overflow-x:clip;
  padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.app{max-width:460px;margin:0 auto;display:grid;gap:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font:800 22px/1.1 "Noto Serif Display",Georgia,serif;margin:0;color:var(--deep)}
header p{margin:2px 0 0;color:var(--soft);font-size:14px}
.gear{min-width:44px;min-height:44px;border-radius:50%;border:1px solid var(--edge);background:#fff;color:var(--rose2);font-size:20px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.hero{position:relative;margin:0 auto;width:min(100%,340px);aspect-ratio:4/4.5;border-radius:170px 170px 28px 28px;overflow:hidden;
  border:4px solid #fff;box-shadow:0 0 0 3px var(--edge),0 16px 36px #e46f9640}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.hero figcaption{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 58px;text-align:center;color:#fff;
  background:linear-gradient(transparent,#7a2e4acc);font:800 20px/1.2 "Noto Serif Display",serif;text-shadow:0 1px 4px #0005}
.hero figcaption small{display:block;font:500 13px "Be Vietnam Pro",sans-serif;opacity:.9}
.app.done .hero{width:min(100%,260px)}.app.done .hero figcaption{padding-bottom:12px}
.stage{display:grid;justify-items:center;margin-top:-74px;position:relative;gap:6px}
.tap{background:none;border:0;padding:0;cursor:pointer;width:210px;-webkit-tap-highlight-color:transparent}
.tap svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 10px 14px #7a2e4a40)}
.tap .shaker{transform-origin:105px 230px}
.tap.shake .shaker{animation:sh .9s ease-in-out}
.tap .pop{transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.tap.done .pop{transform:translateY(-34px)}
@keyframes sh{0%,100%{transform:rotate(0) translateY(0)}12%{transform:rotate(-10deg) translateY(-6px)}25%{transform:rotate(9deg) translateY(2px)}38%{transform:rotate(-8deg) translateY(-5px)}52%{transform:rotate(7deg) translateY(2px)}66%{transform:rotate(-5deg) translateY(-3px)}80%{transform:rotate(3deg)}}
.btn.shakebtn{min-width:200px;min-height:54px;border:0;border-radius:27px;background:linear-gradient(180deg,#f08aac,var(--rose2));color:#fff;font:800 18px "Be Vietnam Pro",sans-serif;box-shadow:0 8px 18px #c94f7a55}
.btn.shakebtn:disabled{opacity:.85}
.tap.shaking .shaker{animation:sh .9s ease-in-out infinite}
.hint{font:800 20px/1.1 "Noto Serif Display",serif;color:var(--deep);text-align:center}
.hint small{display:block;font:500 13px "Be Vietnam Pro",sans-serif;color:var(--soft);margin-top:4px}
.res{display:none;gap:14px}.res.on{display:grid}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--edge);border-radius:22px;padding:14px 12px 16px;text-align:center;box-shadow:0 10px 24px #e46f9626}
.tile small{color:var(--soft);font-size:14px}
.num{font:800 clamp(72px,24vw,104px)/1 "Noto Serif Display",serif;color:var(--rose2);font-variant-numeric:tabular-nums}
.tile p{margin:6px 0 0;font-size:13px;color:var(--soft)}
.card{background:var(--card);border:1px solid var(--edge);border-radius:20px;padding:16px}
.sc{display:flex;align-items:baseline;gap:8px;color:var(--deep)}.sc b{font:800 40px/1 "Noto Serif Display",serif}
.meter{height:10px;border-radius:6px;background:var(--bg2);overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f5a3bd,var(--rose2));transition:width .7s}
.rel{font-weight:700;color:var(--rose2)}.card p{margin:6px 0 0;font-size:15px}
.row{display:flex;gap:10px}.row button{flex:1}
.btn{min-height:48px;border-radius:16px;border:1px solid var(--edge);background:#fff;color:var(--deep);font:700 15px "Be Vietnam Pro",sans-serif;cursor:pointer}
.sheet{display:none}.sheet.on{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:14px;color:var(--soft)}
input[type=date],input[type=time]{font:inherit;font-size:16px;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--edge);background:#fff;color:var(--ink)}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-size:15px}.chk input{width:22px;height:22px;accent-color:var(--rose)}
.fine{font-size:13px;color:var(--soft);text-align:center;margin:0}
@media(prefers-reduced-motion:reduce){.tap.shake .shaker,.tap.shaking .shaker{animation:none}.meter i,.tap .pop{transition:none}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div><h1>Quẻ hôm nay</h1><p id="date"></p></div>
    <button class="gear" id="gear" aria-label="Đổi ngày sinh">⚙</button>
  </header>

  <section class="sheet card" id="sheet">
    <label>Ngày sinh dương lịch<input type="date" id="dob"></label>
    <label>Giờ sinh<input type="time" id="tob"></label>
    <div class="chk" id="tetWrap"><input type="checkbox" id="tet"><span>Sinh trước Tết Nguyên Đán năm đó</span></div>
    <button class="btn" id="save" style="background:var(--rose);color:#fff;border:0">Lưu</button>
  </section>

  <figure class="hero"><img src="con-gai.jpg" alt="Con gái đang gieo quẻ"><figcaption id="cap">Quẻ của Bố hôm nay<small>Chúc Bố may mắn!</small></figcaption></figure>

  <section class="stage" id="stage">
    <button class="tap" id="tap" aria-label="Lắc ống quẻ">
<svg viewBox="0 0 210 250" aria-hidden="true">
 <g class="shaker">
  <g stroke="#b98a4a" stroke-width="1.2">
   <rect x="72" y="28" width="9" height="80" rx="4" fill="#efcf8f" transform="rotate(-9 76 108)"/>
   <rect x="88" y="16" width="9" height="90" rx="4" fill="#f3d79c" transform="rotate(-4 92 106)"/>
   <rect x="113" y="18" width="9" height="90" rx="4" fill="#f3d79c" transform="rotate(5 117 108)"/>
   <rect x="127" y="30" width="9" height="80" rx="4" fill="#efcf8f" transform="rotate(10 131 110)"/>
  </g>
  <g class="pop"><rect x="100" y="4" width="10" height="104" rx="4" fill="#f7dfa8" stroke="#b98a4a" stroke-width="1.2"/><rect x="100" y="4" width="10" height="18" rx="4" fill="#e46f96"/></g>
  <path d="M58 96h94l-8 132a10 10 0 0 1-10 9H76a10 10 0 0 1-10-9z" fill="#e46f96"/>
  <path d="M58 96h94l-1 14H59z" fill="#c94f7a"/>
  <ellipse cx="105" cy="96" rx="47" ry="10" fill="#f59ab7" stroke="#c94f7a" stroke-width="2"/>
  <ellipse cx="105" cy="96" rx="38" ry="6" fill="#7a2e4a"/>
  <rect x="61" y="128" width="88" height="7" fill="#d9a441"/><rect x="64" y="205" width="82" height="7" fill="#d9a441"/>
  <circle cx="105" cy="170" r="19" fill="#fff3d6" stroke="#d9a441" stroke-width="3"/>
  <text x="105" y="178" text-anchor="middle" font-size="22" font-weight="800" fill="#c94f7a" font-family="Noto Serif Display,serif">福</text>
  <path d="M74 112c4 30 4 70 2 108" stroke="#fff" stroke-opacity=".35" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g>
   <path d="M8 250c4-40 20-70 46-80l14 22c-14 10-22 34-24 58z" fill="#f6efe3" stroke="#e2d5c0" stroke-width="2"/>
   <circle cx="62" cy="180" r="17" fill="#f6efe3" stroke="#e2d5c0" stroke-width="2"/>
   <path d="M60 158c10-4 20 2 18 14l-2 30c-1 10-14 12-20 4l-4-30c-2-10 0-16 8-18z" fill="#ffd9c4" stroke="#e8b39b" stroke-width="2"/>
   <path d="M67 166h9M66 178h10M66 190h9" stroke="#e8b39b" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g>
   <path d="M202 250c-4-40-20-70-46-80l-14 22c14 10 22 34 24 58z" fill="#f6efe3" stroke="#e2d5c0" stroke-width="2"/>
   <circle cx="148" cy="180" r="17" fill="#f6efe3" stroke="#e2d5c0" stroke-width="2"/>
   <path d="M150 158c-10-4-20 2-18 14l2 30c1 10 14 12 20 4l4-30c2-10 0-16-8-18z" fill="#ffd9c4" stroke="#e8b39b" stroke-width="2"/>
   <path d="M143 166h-9M144 178h-10M144 190h-9" stroke="#e8b39b" stroke-width="2" stroke-linecap="round"/>
  </g>
 </g>
</svg></button>
    <button class="btn shakebtn" id="shakeBtn">Lắc quẻ</button>
    <div class="hint"><small id="tapsub">Bấm "Lắc quẻ", bé lắc 5 giây rồi ra quẻ</small></div>
  </section>

  <section class="res" id="res">
    <div class="tiles">
      <div class="tile"><small>Số mệnh</small><div class="num" id="n1">--</div><p id="m1"></p></div>
      <div class="tile"><small>Số ngày</small><div class="num" id="n2">--</div><p id="m2"></p></div>
    </div>
    <div class="card">
      <div class="sc"><b id="sc">–</b><span style="color:var(--soft)">/10 điểm ngày</span></div>
      <div class="meter"><i id="bar"></i></div>
      <div class="rel" id="rel"></div>
      <p id="relp"></p>
      <p id="tip" style="color:var(--soft)"></p>
    </div>
    <div class="row"><button class="btn" id="copy">Sao chép quẻ</button><button class="btn" id="again">Xem lại nghi thức</button></div>
  </section>

  <p class="fine" id="prof"></p>
  <p class="fine">Mỗi ngày một quẻ, gieo lại vẫn ra cùng số. Chỉ để tham khảo, giải trí.</p>
</main>
<script>
{
const $=id=>document.getElementById(id);
const CAN=['Giáp','Ất','Bính','Đinh','Mậu','Kỷ','Canh','Tân','Nhâm','Quý'];
const CHI=['Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'];
const NAP=[['Hải Trung Kim','Kim'],['Lư Trung Hỏa','Hỏa'],['Đại Lâm Mộc','Mộc'],['Lộ Bàng Thổ','Thổ'],['Kiếm Phong Kim','Kim'],['Sơn Đầu Hỏa','Hỏa'],['Giản Hạ Thủy','Thủy'],['Thành Đầu Thổ','Thổ'],['Bạch Lạp Kim','Kim'],['Dương Liễu Mộc','Mộc'],['Tuyền Trung Thủy','Thủy'],['Ốc Thượng Thổ','Thổ'],['Tích Lịch Hỏa','Hỏa'],['Tùng Bách Mộc','Mộc'],['Trường Lưu Thủy','Thủy'],['Sa Trung Kim','Kim'],['Sơn Hạ Hỏa','Hỏa'],['Bình Địa Mộc','Mộc'],['Bích Thượng Thổ','Thổ'],['Kim Bạch Kim','Kim'],['Phú Đăng Hỏa','Hỏa'],['Thiên Hà Thủy','Thủy'],['Đại Trạch Thổ','Thổ'],['Thoa Xuyến Kim','Kim'],['Tang Đố Mộc','Mộc'],['Đại Khê Thủy','Thủy'],['Sa Trung Thổ','Thổ'],['Thiên Thượng Hỏa','Hỏa'],['Thạch Lựu Mộc','Mộc'],['Đại Hải Thủy','Thủy']];
const EL={'Kim':{d:[4,9],c:'trắng, xám, ánh kim',h:'Tây'},'Thủy':{d:[1,6],c:'đen, xanh dương',h:'Bắc'},'Mộc':{d:[3,8],c:'xanh lá',h:'Đông'},'Hỏa':{d:[2,7],c:'đỏ, hồng, tím',h:'Nam'},'Thổ':{d:[5,0],c:'vàng, nâu đất',h:'Trung cung (gần nhà, chính giữa)'}};
const GEN={'Kim':'Thổ','Thủy':'Kim','Mộc':'Thủy','Hỏa':'Mộc','Thổ':'Hỏa'};
const CHILD={'Kim':'Thủy','Thủy':'Mộc','Mộc':'Hỏa','Hỏa':'Thổ','Thổ':'Kim'};
const BEAT={'Kim':'Mộc','Mộc':'Thổ','Thổ':'Thủy','Thủy':'Hỏa','Hỏa':'Kim'};
const BEATBY={'Kim':'Hỏa','Mộc':'Kim','Thổ':'Mộc','Thủy':'Thổ','Hỏa':'Thủy'};
const DEL={1:'Thủy',6:'Thủy',2:'Hỏa',7:'Hỏa',3:'Mộc',8:'Mộc',4:'Kim',9:'Kim',5:'Thổ',0:'Thổ'};
const MEAN=['viên mãn, khởi nguồn','khởi đầu, chủ động','hòa hợp, kết nối','sáng tạo, giao tiếp','nền tảng, kỷ luật','tự do, đổi mới','yêu thương, trách nhiệm','trực giác, chiêm nghiệm','tài lộc, quyền lực','bao dung, hoàn thành'];
const REL={
  sinhNhap:{s:9,t:'Đại cát – ngày sinh nhập',p:'Năng lượng ngày nuôi dưỡng mệnh bạn. Hợp khởi sự, gặp gỡ, quyết việc lớn.'},
  tyHoa:{s:8,t:'Cát – ngày tỷ hòa',p:'Ngày cùng hành với mệnh, thuận để củng cố, hợp tác với người cùng chí hướng.'},
  sinhXuat:{s:6,t:'Bình – ngày sinh xuất',p:'Mệnh bạn cho đi năng lượng. Hợp giúp người, dạy, chia sẻ; tránh làm quá sức.'},
  khacXuat:{s:5,t:'Bình – ngày khắc xuất',p:'Bạn nắm thế chủ động nhưng dễ va chạm. Làm việc chắc tay, nói năng mềm mỏng.'},
  khacNhap:{s:3,t:'Cần thận trọng – ngày khắc nhập',p:'Năng lượng ngày khắc mệnh. Nên giữ nhịp chậm, kiểm tra kỹ trước khi quyết.'}};
const sumD=n=>String(n).split('').reduce((a,b)=>a+(+b||0),0);
const red=(n,keep)=>{while(n>9&&!(keep&&(n===11||n===22||n===33)))n=sumD(n);return n};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const vn=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const gioChi=t=>{const [h,m]=t.split(':').map(Number);return CHI[Math.floor(((h+1)%24)/2)]};
function profile(dob,tet){
  const b=parse(dob),y=b.getFullYear()-(tet?1:0);
  const k=((y-4)%60+60)%60,nap=NAP[k>>1];
  return{b,lp:red(sumD(dob.replace(/-/g,'')),true),canchi:CAN[((y-4)%10+10)%10]+' '+CHI[((y-4)%12+12)%12],lunarY:y,nap:nap[0],m:nap[1]};
}
function que(P,dob,day){
  const r=rng(hash(dob+'|'+st.tob+'|'+ymd(day)));const pick=a=>a[Math.floor(r()*a.length)];
  const py=red(P.b.getDate()+(P.b.getMonth()+1)+sumD(day.getFullYear()));
  const pm=red(py+day.getMonth()+1),pd=red(pm+day.getDate());
  const m=P.m,de=DEL[pd],gen=EL[GEN[m]].d,own=EL[m].d,bad=EL[BEATBY[m]].d;
  let rel=de===GEN[m]?'sinhNhap':de===m?'tyHoa':de===CHILD[m]?'sinhXuat':de===BEAT[m]?'khacXuat':'khacNhap';
  let s=REL[rel].s+(pd===red(P.lp)?1:0);s=Math.min(10,s);
  const a=pick(gen),b2=pick(own),n1=a*10+b2;
  const t=bad.includes(pd)?pick(gen):pd,pool=[...gen,...own];let u=pick(pool);
  for(let i=0;i<12&&t*10+u===n1;i++)u=pick(pool);
  return{py,pm,pd,de,rel,s,n1,n2:t*10+u};
}
const descr=n=>{const t=Math.floor(n/10),u=n%10;return t+' ('+DEL[t]+': '+MEAN[t]+') · '+u+' ('+DEL[u]+': '+MEAN[u]+')'};

const W=['CN','T2','T3','T4','T5','T6','T7'];
let st={dob:'1990-07-20',tob:'17:30',tet:false,last:''};
try{Object.assign(st,JSON.parse(localStorage.getItem('quehomnay.v1')||'{}'))}catch(e){}
if(!st.tob)st.tob='17:30';
const save=()=>{try{localStorage.setItem('quehomnay.v1',JSON.stringify(st))}catch(e){}};
let today=new Date();today.setHours(0,0,0,0);
let cur=null;
function calc(){
  const b=parse(st.dob),tet=b.getMonth()<2&&st.tet,P=profile(st.dob,tet),Q=que(P,st.dob,today);cur={P,Q};
  $('date').textContent=W[today.getDay()]+', '+vn(today);
  $('prof').textContent='Sinh '+st.tob.replace(':','h')+' (giờ '+gioChi(st.tob)+') ngày '+vn(b)+' · '+P.canchi+' · mệnh '+P.nap+' · số chủ đạo '+P.lp;
  return{P,Q};
}
function show(anim){
  const {P,Q}=calc();
  $('stage').style.display='none';$('res').classList.add('on');
  const fin=()=>{$('n1').textContent=pad(Q.n1);$('n2').textContent=pad(Q.n2);$('bar').style.width=Q.s*10+'%'};
  if(anim&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const t0=Date.now();const iv=setInterval(()=>{$('n1').textContent=pad(Math.floor(Math.random()*100));$('n2').textContent=pad(Math.floor(Math.random()*100));if(Date.now()-t0>800){clearInterval(iv);fin()}},60)}else fin();
  $('m1').textContent=descr(Q.n1);$('m2').textContent=descr(Q.n2);
  $('sc').textContent=Q.s;$('rel').textContent=REL[Q.rel].t;
  $('relp').textContent='Ngày cá nhân số '+Q.pd+' (hành '+Q.de+'), mệnh bạn '+P.m+'. '+REL[Q.rel].p;
  $('tip').textContent='Màu hợp: '+EL[GEN[P.m]].c+'. Hướng tốt: '+EL[GEN[P.m]].h+'.';
  document.querySelector('.app').classList.add('done');
}
function resetStage(){document.querySelector('.app').classList.remove('done');$('res').classList.remove('on');$('stage').style.display='grid';$('tap').classList.remove('shake','shaking','done')}
let busy=false;
function doShake(){if(busy)return;busy=true;const t=$('tap'),b=$('shakeBtn');t.classList.remove('done','shake');t.classList.add('shaking');
  let n=5;b.disabled=true;b.textContent='Đang lắc… '+n;
  const iv=setInterval(()=>{n--;if(n>0)b.textContent='Đang lắc… '+n;else{clearInterval(iv);t.classList.remove('shaking');t.classList.add('done');b.textContent='Ra quẻ!';
    setTimeout(()=>{busy=false;b.disabled=false;b.textContent='Lắc quẻ';st.last=ymd(today);save();show(false)},700)}},1000)}
$('shakeBtn').addEventListener('click',doShake);$('tap').addEventListener('click',doShake);
$('again').addEventListener('click',()=>{resetStage();$('tapsub').textContent='Quẻ hôm nay đã định – lắc lại vẫn ra quẻ này'});
const openSheet=()=>{$('dob').value=st.dob;$('tob').value=st.tob;$('tet').checked=st.tet;$('tetWrap').style.display=parse(st.dob).getMonth()<2?'flex':'none';$('sheet').classList.toggle('on')};
$('gear').addEventListener('click',openSheet);
$('dob').addEventListener('input',()=>{if($('dob').value)$('tetWrap').style.display=parse($('dob').value).getMonth()<2?'flex':'none'});
$('save').addEventListener('click',()=>{if(!$('dob').value)return;st.dob=$('dob').value;st.tob=$('tob').value||'17:30';st.tet=$('tet').checked;save();$('sheet').classList.remove('on');calc();if($('res').classList.contains('on'))show(false)});
$('copy').addEventListener('click',async()=>{if(!cur)return;const t=`Quẻ ${vn(today)}: ${pad(cur.Q.n1)} – ${pad(cur.Q.n2)} · ${cur.Q.s}/10 · ${REL[cur.Q.rel].t}`;
  let ok=false;try{if(window.AndroidApp)ok=window.AndroidApp.copy(t);else{await navigator.clipboard.writeText(t);ok=true}}catch(e){}
  $('copy').textContent=ok?'Đã chép':'Không chép được';setTimeout(()=>$('copy').textContent='Sao chép quẻ',1600)});
function boot(){calc();if(st.last===ymd(today))show(false);else resetStage()}
boot();
// App mở lại sang ngày mới thì tự sang quẻ mới
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;const n=new Date();n.setHours(0,0,0,0);if(n.getTime()!==today.getTime()){today=n;boot()}});
}
</script>
