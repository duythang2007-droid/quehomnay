name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk QueHomNay.apk
      - uses: actions/upload-artifact@v4
        with: { name: QueHomNay-apk, path: QueHomNay.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Quẻ hôm nay v1.0.${{ github.run_number }}
          make_latest: true
          files: QueHomNay.apk
